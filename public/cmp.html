<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercedes-Benz · Change Management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Source+Sans+3:wght@400;700&display=swap"><style>:root{color-scheme:light}
/* ─────────────────────────────────────────────────────────────
   Change Spine — RC&Change Platform redesign prototype
   Palette logic: interactive chrome is graphite (unsaturated) so that
   red / amber / green are the ONLY saturated colors on screen and
   therefore read as status at a glance. This is a status tool; the
   accent must not compete with the signal.
   ───────────────────────────────────────────────────────────── */

:root{
  --ground:#F1F3F5;
  --surface:#FFFFFF;
  --surface-2:#F7F9FA;
  --surface-3:#EBEFF2;
  --ink:#12161B;
  --ink-2:#56616E;
  --ink-3:#8A95A3;
  --rule:#DFE4E9;
  --rule-2:#C6CDD5;
  --accent:#1B2128;
  --accent-ink:#FFFFFF;
  --accent-soft:#E7EAEE;
  --focus:#3C6AA8;

  --go:#176B46;      --go-bg:#E3F1E9;   --go-edge:#9ED3B8;
  --wait:#8E5405;    --wait-bg:#FAEDD8; --wait-edge:#E3BE7C;
  --stop:#A81F33;    --stop-bg:#FAE4E7; --stop-edge:#E3A2AC;
  --info:#2C4A80;    --info-bg:#E5ECF7; --info-edge:#A8BEE0;
  --idle:#67727F;    --idle-bg:#EAEEF1; --idle-edge:#CBD3DA;
  --on-stop:#FFFFFF;

  --shadow:0 1px 2px rgba(18,22,27,.05), 0 6px 18px -8px rgba(18,22,27,.16);
  --shadow-lg:0 2px 6px rgba(18,22,27,.07), 0 24px 48px -20px rgba(18,22,27,.28);

  --font-display:"Avenir Next","Futura","Century Gothic",system-ui,sans-serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-data:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --rail-w:236px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C0F12;
    --surface:#15191E;
    --surface-2:#1A1F25;
    --surface-3:#222931;
    --ink:#E8ECF0;
    --ink-2:#9BA6B3;
    --ink-3:#6E7985;
    --rule:#252C34;
    --rule-2:#39434E;
    --accent:#E8ECF0;
    --accent-ink:#12161B;
    --accent-soft:#222931;
    --focus:#7FA3D8;

    --go:#5FC392;      --go-bg:#112E22;   --go-edge:#28573F;
    --wait:#E0A94A;    --wait-bg:#312310; --wait-edge:#5C4520;
    --stop:#F07D90;    --stop-bg:#36151B; --stop-edge:#622B35;
    --info:#8CAAE2;    --info-bg:#182235; --info-edge:#2E405F;
    --idle:#8A95A3;    --idle-bg:#20262D; --idle-edge:#343C45;
    --on-stop:#15191E;

    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0F12;
  --surface:#15191E;
  --surface-2:#1A1F25;
  --surface-3:#222931;
  --ink:#E8ECF0;
  --ink-2:#9BA6B3;
  --ink-3:#6E7985;
  --rule:#252C34;
  --rule-2:#39434E;
  --accent:#E8ECF0;
  --accent-ink:#12161B;
  --accent-soft:#222931;
  --focus:#7FA3D8;

  --go:#5FC392;      --go-bg:#112E22;   --go-edge:#28573F;
  --wait:#E0A94A;    --wait-bg:#312310; --wait-edge:#5C4520;
  --stop:#F07D90;    --stop-bg:#36151B; --stop-edge:#622B35;
  --info:#8CAAE2;    --info-bg:#182235; --info-edge:#2E405F;
  --idle:#8A95A3;    --idle-bg:#20262D; --idle-edge:#343C45;
  --on-stop:#15191E;

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}


/* ── Shell ───────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}

.rail{
  background:var(--surface);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 18px 16px;
  border-bottom:1px solid var(--rule);
}
.brand svg{flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;font-size:14.5px}
.brand-sub{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}

.nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-group{
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 10px 6px;font-weight:700;
}
.nav-group:first-child{padding-top:2px}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border:0;background:none;border-radius:7px;
  cursor:pointer;text-align:left;color:var(--ink-2);font-weight:700;
}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.navitem svg{flex:none;opacity:.85}
.navitem .count{
  margin-left:auto;font-family:var(--font-data);font-size:12px;
  background:var(--stop-bg);color:var(--stop);border:1px solid var(--stop-edge);
  padding:0 6px;border-radius:999px;font-weight:700;
}
.navitem[aria-current="page"] .count{background:transparent;border-color:currentColor;color:inherit}


/* ── Topbar ──────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);min-width:0}
.crumbs b{color:var(--ink);font-weight:700}
.crumbs .sep{opacity:.5}

.omni{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--rule);
  border-radius:8px;padding:6px 10px;width:300px;cursor:text;color:var(--ink-3);
}
.omni kbd{
  margin-left:auto;font-family:var(--font-data);font-size:12px;
  border:1px solid var(--rule-2);border-radius:4px;padding:1px 5px;color:var(--ink-3);
}
.iconbtn{
  display:grid;place-items:center;width:32px;height:32px;
  border:1px solid var(--rule);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--ink-2);
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

.avatar{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;
}

/* ── Page canvas ─────────────────────────────────────────── */
.canvas{padding:24px;max-width:1360px;width:100%}
.page{display:none}
.page.is-active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.ptitle{
  font-family:var(--font-display);font-size:23px;font-weight:700;
  letter-spacing:-.015em;margin:0 0 3px;text-wrap:balance;
}
.psub{color:var(--ink-2);margin:0 0 22px;font-size:13.5px;max-width:68ch}

.sect{margin-bottom:28px}
.sect-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.sect-head h2{
  font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;margin:0;color:var(--ink-2);
}
.sect-head .hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}

.card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:10px;box-shadow:var(--shadow);
}
.card-pad{padding:18px}

/* ── Status primitives ───────────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;line-height:1.6;
  padding:1px 8px;border-radius:5px;border:1px solid;white-space:nowrap;
}
.pill.go{background:var(--go-bg);color:var(--go);border-color:var(--go-edge)}
.pill.wait{background:var(--wait-bg);color:var(--wait);border-color:var(--wait-edge)}
.pill.stop{background:var(--stop-bg);color:var(--stop);border-color:var(--stop-edge)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-edge)}
.pill.idle{background:var(--idle-bg);color:var(--idle);border-color:var(--idle-edge)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.flag{
  display:inline-flex;align-items:center;
  font-family:var(--font-data);font-size:12px;font-weight:700;
  letter-spacing:.03em;padding:1px 5px;border-radius:4px;
  background:var(--stop-bg);color:var(--stop);border:1px solid var(--stop-edge);
}
.flag.soft{background:var(--wait-bg);color:var(--wait);border-color:var(--wait-edge)}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:7px;border:1px solid var(--rule-2);
  background:var(--surface);cursor:pointer;font-weight:700;font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--stop);border-color:var(--stop-edge);background:var(--stop-bg)}
.btn.sm{padding:4px 10px;font-size:12.5px}

/* ── Today: action queue ─────────────────────────────────── */
.queue{display:flex;flex-direction:column;gap:10px}
.qrow{
  display:grid;grid-template-columns:3px 1fr auto;gap:0;
  background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow);
}
.qrow .rail-sev{background:var(--stop)}
.qrow.is-wait .rail-sev{background:var(--wait)}
.qrow.is-info .rail-sev{background:var(--info)}
.qbody{padding:14px 16px;min-width:0}
.qwhy{font-weight:700;font-size:14.5px;margin:0 0 4px;letter-spacing:-.005em}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:12.5px;align-items:center}
.qacts{display:flex;align-items:center;gap:8px;padding:14px 16px;border-left:1px solid var(--rule);background:var(--surface-2)}

/* ── Stat strip ──────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;cursor:pointer;text-align:left;border:0;display:block;width:100%}
.stat:hover{background:var(--surface-2)}
.stat .v{font-family:var(--font-data);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--ink-2);margin-top:3px}
.stat .k em{font-style:normal;color:var(--ink-3)}
.stat.alert .v{color:var(--stop)}
.stat.warn .v{color:var(--wait)}

/* ── Timeline rail (today) ───────────────────────────────── */
.daygrid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media (max-width:1100px){.daygrid{grid-template-columns:1fr}}

.tl{position:relative;padding:4px 0}
.tl-hour{display:grid;grid-template-columns:52px 1fr;gap:12px;min-height:40px}
.tl-hour .h{font-family:var(--font-data);font-size:12px;color:var(--ink-3);padding-top:1px;text-align:right}
.tl-hour .slot{border-top:1px solid var(--rule);padding:3px 0 9px;display:flex;flex-direction:column;gap:5px}
.tl-hour.freeze .slot{background:repeating-linear-gradient(135deg,transparent,transparent 6px,var(--stop-bg) 6px,var(--stop-bg) 12px)}
.tl-ev{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  border:1px solid var(--rule);border-left:3px solid var(--info);
  background:var(--surface);border-radius:7px;padding:6px 10px;font-size:12.5px;
  cursor:pointer;
}
.tl-ev:hover{background:var(--surface-2)}
.tl-ev.go{border-left-color:var(--go)}
.tl-ev.stop{border-left-color:var(--stop)}
.tl-ev.wait{border-left-color:var(--wait)}
.tl-freeze-label{
  font-size:12px;font-weight:700;color:var(--stop);
  display:flex;align-items:center;gap:6px;padding:2px 0;
}

/* ── Table ───────────────────────────────────────────────── */
.views{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.view{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:7px;border:1px solid var(--rule);
  background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);
}
.view:hover{background:var(--surface-2);color:var(--ink)}
.view[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.view .n{font-family:var(--font-data);font-size:12px;opacity:.7}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{
  display:flex;align-items:center;gap:8px;flex:1;min-width:220px;
  background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;
}
.search input{border:0;background:none;outline:none;width:100%}
.search input::placeholder{color:var(--ink-3)}





.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
table.grid{border-collapse:collapse;width:100%;min-width:900px}
table.grid th{
  text-align:left;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:10px 12px;
  border-bottom:1px solid var(--rule);background:var(--surface-2);white-space:nowrap;
}
table.grid td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--surface-2)}
td.sev{padding:0;width:3px}
td.sev i{display:block;width:3px;height:52px;background:var(--idle-edge)}
tr.sev-stop td.sev i{background:var(--stop)}
tr.sev-wait td.sev i{background:var(--wait)}
tr.sev-go td.sev i{background:var(--go)}
.cid{font-family:var(--font-data);font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.csub{font-size:12px;color:var(--ink-3);margin-top:1px}
.svc{font-weight:700;font-size:13px}
.ver{font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
.stagecell{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.blocknote{font-size:12px;color:var(--stop);display:flex;align-items:center;gap:4px}
.winc{font-family:var(--font-data);font-size:12px;white-space:nowrap}
.winrel{font-size:12px;color:var(--ink-3)}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.rowacts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}

/* ── Change detail ───────────────────────────────────────── */
.dhead{
  background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;
}
.dhead-top{display:flex;align-items:flex-start;gap:18px;padding:18px 20px;flex-wrap:wrap}
.dhead h1{font-family:var(--font-data);font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em}
.dhead .dmeta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.dhead .dacts{margin-left:auto;display:flex;gap:8px;align-items:center}

.verdict{
  display:flex;gap:13px;align-items:flex-start;
  padding:14px 20px;border-top:1px solid var(--rule);
  background:var(--stop-bg);
}
.verdict .vi{
  width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px;
  display:grid;place-items:center;background:var(--stop);color:var(--on-stop);
  font-weight:800;font-size:13px;
}
.verdict b{display:block;color:var(--stop);font-size:14px;margin-bottom:2px}
.verdict p{margin:0;color:var(--ink-2);font-size:13px;max-width:78ch}
.verdict .vacts{margin-left:auto;display:flex;gap:8px;align-self:center}

/* Spine */
.spine{
  list-style:none;margin:0;padding:18px 20px 20px;display:flex;
  border-top:1px solid var(--rule);background:var(--surface-2);overflow-x:auto;
}
.spine li{flex:1 0 128px;position:relative;padding-right:10px}
.spine li::before{
  content:"";position:absolute;left:0;right:10px;top:7px;height:2px;background:var(--rule-2);
}
.spine li:last-child::before{display:none}
.spine li.done::before{background:var(--go)}
.spine .dot{
  position:relative;z-index:1;display:block;width:16px;height:16px;border-radius:50%;
  background:var(--surface);border:2px solid var(--rule-2);margin-bottom:9px;
}
.spine li.done .dot{background:var(--go);border-color:var(--go)}
.spine li.now .dot{
  background:var(--surface);border-color:var(--stop);border-width:4px;
  box-shadow:0 0 0 4px var(--stop-bg);
}
.spine li.now.waiting .dot{border-color:var(--wait);box-shadow:0 0 0 4px var(--wait-bg)}
.spine b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.005em}
.spine li.todo b{color:var(--ink-3);font-weight:700}
.spine time,.spine .st{display:block;font-family:var(--font-data);font-size:12px;color:var(--ink-3);margin-top:2px}
.spine li.now b{color:var(--stop)}
.spine li.now.waiting b{color:var(--wait)}
.spine li.now .st{color:var(--stop);font-weight:700}
.spine li.now.waiting .st{color:var(--wait)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px;overflow-x:auto}
.tab{
  border:0;background:none;padding:9px 14px;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .tn{
  font-family:var(--font-data);font-size:12px;margin-left:5px;
  background:var(--surface-3);padding:0 5px;border-radius:4px;color:var(--ink-2);
}
.tab.has-alert .tn{background:var(--stop-bg);color:var(--stop)}
.tpanel{display:none}
.tpanel.is-active{display:block}

.cols2{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media (max-width:1040px){.cols2{grid-template-columns:1fr}}

/* Definition grid */
.dl{display:grid;grid-template-columns:auto 1fr;gap:0;font-size:13.5px}
.dl dt{
  padding:9px 16px 9px 0;color:var(--ink-2);border-bottom:1px solid var(--rule);
  white-space:nowrap;font-size:12.5px;
}
.dl dd{padding:9px 0;margin:0;border-bottom:1px solid var(--rule);text-align:right}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}

/* Gauge */


.gauge-v{font-family:var(--font-data);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.gauge-k{font-size:12px;color:var(--ink-2);margin-top:4px}

/* Check list */
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule)}
.check:last-child{border-bottom:0}
.check .nm{font-weight:700;font-size:13.5px}
.check .ds{font-size:12.5px;color:var(--ink-2);margin-left:auto;text-align:right}

/* Empty state done right */
.empty{
  border:1px dashed var(--rule-2);border-radius:10px;padding:24px;
  text-align:center;background:var(--surface-2);
}
.empty b{display:block;font-size:14px;margin-bottom:5px}
.empty p{margin:0 auto 14px;color:var(--ink-2);font-size:13px;max-width:52ch}

/* Vertical timeline */
.vt{list-style:none;margin:0;padding:0}
.vt li{display:grid;grid-template-columns:14px 1fr;gap:13px;padding-bottom:16px;position:relative}
.vt li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--rule)}
.vt li:last-child{padding-bottom:0}
.vt li:last-child::before{display:none}
.vt .vd{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--rule-2);margin-top:3px;z-index:1}
.vt li.ok .vd{background:var(--go);border-color:var(--go)}
.vt li.bad .vd{background:var(--stop);border-color:var(--stop)}
.vt li.hold .vd{background:var(--wait);border-color:var(--wait)}
.vt .vb{font-weight:700;font-size:13.5px}
.vt .vm{font-family:var(--font-data);font-size:12px;color:var(--ink-3)}
.vt .vx{font-size:13px;color:var(--ink-2);margin-top:2px}

/* Calendar */
.cal{display:grid;grid-template-columns:52px repeat(5,1fr);border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.cal .ch{padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.cal .ch.today{color:var(--ink);background:var(--accent-soft)}
.cal .ct{padding:6px 8px;font-family:var(--font-data);font-size:12px;color:var(--ink-3);text-align:right;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cal .cc{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:4px;min-height:42px;position:relative}
.cal .cc:nth-child(6n){border-right:0}
.cal .cc.frz{background:repeating-linear-gradient(135deg,transparent,transparent 6px,var(--stop-bg) 6px,var(--stop-bg) 12px)}
.cal .cev{
  background:var(--info-bg);border:1px solid var(--info-edge);color:var(--info);
  border-radius:5px;padding:2px 6px;font-size:12px;font-weight:700;
  font-family:var(--font-data);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.cal .cev.go{background:var(--go-bg);border-color:var(--go-edge);color:var(--go)}
.cal .cev.wait{background:var(--wait-bg);border-color:var(--wait-edge);color:var(--wait)}
.callegend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-2);align-items:center}
.callegend span{display:flex;align-items:center;gap:7px}
.swatch{width:13px;height:13px;border-radius:4px;border:1px solid}
.swatch.frz{background:repeating-linear-gradient(135deg,transparent,transparent 3px,var(--stop-bg) 3px,var(--stop-bg) 6px);border-color:var(--stop-edge)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ════════════════ v2 additions ════════════════ */
.canvas{max-width:1440px}
.rolesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.rolesel select{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;font-weight:700;color:var(--ink)}
.omni{border:1px solid var(--rule)}
.omni:hover{border-color:var(--rule-2);color:var(--ink-2)}
.navitem .count.info{background:var(--info-bg);color:var(--info);border-color:var(--info-edge)}



/* hero find */
.kbd{font-family:var(--font-data);font-size:12px;border:1px solid var(--rule-2);border-radius:4px;padding:1px 5px;color:var(--ink-3)}

/* verdict tones */
.verdict.wait{background:var(--wait-bg)} .verdict.wait .vi{background:var(--wait)} .verdict.wait b{color:var(--wait)}
.verdict.go{background:var(--go-bg)} .verdict.go .vi{background:var(--go)} .verdict.go b{color:var(--go)}
.verdict.info{background:var(--info-bg)} .verdict.info .vi{background:var(--info)} .verdict.info b{color:var(--info)}
.verdict.idle{background:var(--idle-bg)} .verdict.idle .vi{background:var(--idle)} .verdict.idle b{color:var(--idle)}
.verdict .vi{color:#fff}
.verdict .owner{margin-top:7px;font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.verdict .owner b{display:inline;color:var(--ink);font-size:12px;margin:0}

/* spine v2 */
.spine li{flex:1 0 118px}
.spine li.now.info .dot{border-color:var(--info);box-shadow:0 0 0 4px var(--info-bg)}
.spine li.now.info b,.spine li.now.info .st{color:var(--info)}
.spine li.now.idle .dot{border-color:var(--idle);box-shadow:0 0 0 4px var(--idle-bg)}
.spine li.now.idle b,.spine li.now.idle .st{color:var(--idle)}
.spine li.skip .dot{border-style:dashed}
.spine li.skip b{color:var(--ink-3);font-weight:700;text-decoration:line-through}
.spine li.done.end .dot{box-shadow:0 0 0 4px var(--go-bg)}
.spine .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.spine .lbl{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.spine li.now .lbl{font-weight:700}

/* lifecycle funnel */
.funnel{display:grid;grid-template-columns:repeat(8,1fr);gap:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:14px}
@media (max-width:1100px){.funnel{grid-template-columns:repeat(4,1fr)}}
.fstage{border:0;border-right:1px solid var(--rule);background:none;text-align:left;padding:10px 12px 11px;cursor:pointer;position:relative}
.fstage:last-child{border-right:0}
.fstage:hover{background:var(--surface-2)}
.fstage[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.fstage .fk{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;white-space:nowrap}
.fstage .fv{font-family:var(--font-data);font-size:22px;font-weight:700;line-height:1.2}
.fstage .fa{font-size:12px;font-weight:700;min-height:16px}
.fstage .fa.stop{color:var(--stop)} .fstage .fa.wait{color:var(--wait)} .fstage .fa.go{color:var(--go)}
.fstage::after{content:"›";position:absolute;right:-5px;top:50%;transform:translateY(-50%);color:var(--rule-2);font-size:16px;z-index:1}
.fstage:last-child::after,.fstage.ended::after{content:""}
.fstage.ended{background:var(--surface-2)}

.facets{display:flex;gap:6px;flex-wrap:wrap}
.facets select{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;color:var(--ink-2)}
.facets select.on{border-color:var(--accent);color:var(--ink);font-weight:700}
mark{background:#FFE58A;color:inherit;border-radius:2px;padding:0 1px}

.ownertag.SRE{border-color:var(--info-edge);color:var(--info);background:var(--info-bg)}
.ownertag.DevOps{border-color:var(--wait-edge);color:var(--wait);background:var(--wait-bg)}
.typetag{font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:0 5px;border:1px solid var(--rule-2);color:var(--ink-2)}
.typetag.Emergency{color:var(--stop);border-color:var(--stop-edge);background:var(--stop-bg)}
.typetag.Configuration{color:var(--info);border-color:var(--info-edge);background:var(--info-bg)}
.matb{font-size:12px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid}
.matb.Gold{color:#8A6A00;background:#FBF3D5;border-color:#E3CF83}
.matb.Silver{color:#4F5B67;background:#EEF1F4;border-color:#C9D1D9}
.matb.Bronze{color:#8A4B1C;background:#F8E8DC;border-color:#DDB394}
.empty-row td{text-align:center;color:var(--ink-3);padding:30px !important;cursor:default}

/* red-line table */
table.rl{border-collapse:collapse;width:100%;font-size:13px}
table.rl th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--rule-2)}
table.rl td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.rl tr:last-child td{border-bottom:0}
table.rl tr.hit td{background:color-mix(in srgb,var(--stop-bg) 55%,transparent)}
table.rl tr.missing td{background:color-mix(in srgb,var(--wait-bg) 55%,transparent)}
table.rl tr.na td{color:var(--ink-3)}
table.rl .sm{font-size:12px;color:var(--ink-3)}

/* Assessment: show findings first; retain rule evidence in disclosures. */
.ass-summary{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;font-size:14px}
.ass-summary .ass-time{margin-left:auto;font-size:12px;color:var(--ink-2);font-family:var(--font-data)}
.ass-counts{margin:10px 0 0;font-size:13px;color:var(--ink-2)}

.ass-note.info{background:var(--info-bg)}
.ass-issues{display:grid;gap:10px;margin-top:14px}
.ass-issue{padding:12px 14px;border:1px solid var(--stop-edge);border-radius:8px;background:var(--surface)}

.ass-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:10px;font-size:13px;line-height:1.6}
.ass-facts .label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.ass-basis{margin-top:9px;font-size:12px}
.ass-basis summary,.ass-cleared>summary{cursor:pointer;color:var(--ink-2);padding:4px 0}
.ass-basis summary:focus-visible,.ass-cleared>summary:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}
.ass-basis dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:8px 0 0;padding:10px;background:var(--surface-2);border-radius:6px;line-height:1.6}
.ass-basis dt{color:var(--ink-2)}
.ass-basis dd{margin:0;overflow-wrap:anywhere}
.ass-cleared{border-top:1px solid var(--rule);margin-top:14px;padding-top:8px;font-size:13px}
.ass-cleared>summary{font-weight:700;color:var(--ink)}
.ass-cleared-list{margin-top:6px}
.ass-cleared-rule{padding:8px 0;border-bottom:1px solid var(--rule);margin:0}
.ass-cleared-rule:last-child{border-bottom:0}

.ass-cleared-rule .ass-clear-evidence{color:var(--ink-2);font-weight:400;margin-left:8px}
.ass-blocker{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px;font-size:12.5px}

@media(max-width:680px){.ass-facts{grid-template-columns:1fr;gap:8px}.ass-summary .ass-time{margin-left:0;width:100%}.ass-basis dl{grid-template-columns:1fr;gap:3px}.ass-basis dd{margin-bottom:6px}.ass-clear-evidence{display:block;margin-left:0!important}}


.json{font-family:var(--font-data);font-size:12px;background:var(--surface-3);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;white-space:pre;overflow:auto;margin:0;line-height:1.55}

  return can("review")&&a.btns.some(isApproval)&&c.state==="Pending For Approval"?"appr":k==="reschedule"?"assess":"ov";

/* Queue = only what blocks the flow. Terminal changes (Close / Rejected / Expired / Cancelled) are not tasks,
   except the emergency post-review, which only becomes due once DevOps has marked the outcome. */
function isTask(c,a){
  const k=taskKey(a);
  if(k==="postreview") return postReviewDue(c);
  if(TERMINAL.indexOf(c.state)>=0) return false;
  if(c.state==="Created"&&a.btns.every(b=>b[1]==="open")) return false;
  return true;
}
function tasksOf(c){
  const tasks=c.acts.filter(a=>isTask(c,a));
  if(postReviewDue(c)&&!tasks.some(a=>taskKey(a)==="postreview")) tasks.push({role:"SRE",tone:"wait",text:"Complete the mandatory emergency post-review",btns:[["Post-review","postreview"]]});
  return tasks;
}
function tasksFor(role){
  const out=[];
  C.forEach(c=>tasksOf(c).forEach(a=>{ if(ownsTask(a,role)&&(!a.btns.some(isApproval)||canApprove(c,role))) out.push({c:c,a:a}); }));
  if(can("review",role)) ESC.filter(e=>e.status==="Open").forEach(e=>out.push({esc:e}));
  const rank={stop:0,wait:1,info:2};
  out.sort((x,y)=>rank[x.esc?"stop":x.a.tone]-rank[y.esc?"stop":y.a.tone]);
  return out;
}

const PEAKS=[[7,9],[16,19]];
const peakTimeRule=()=>"Mon–Fri "+PEAKS.map(p=>pad(p[0])+":00–"+pad(p[1])+":00").join(", ");
function inScope(f,svc){ return f.scope==="Global"||!svc||f.svcs.indexOf(svc)>=0; }
function blockerHits(ws,we,svc,only){
  const out=[]; if(!ws||!we||!(we>ws)) return out;
  (only?[only]:FLAGS.filter(f=>f.active)).filter(f=>inScope(f,svc)).forEach(f=>{
    if(f.type==="Once"){ const s=T(f.s), e=T(f.e); if(ws<e&&we>s) out.push({f:f,s:new Date(Math.max(ws,s)),e:new Date(Math.min(we,e))}); }
    else{
      const d=new Date(ws); d.setHours(0,0,0,0);
      while(d<we){ const wd=d.getDay(); if(wd>0&&wd<6) PEAKS.forEach(p=>{ const s=new Date(d); s.setHours(p[0]); const e=new Date(d); e.setHours(p[1]); if(ws<e&&we>s) out.push({f:f,s:new Date(Math.max(ws,s)),e:new Date(Math.min(we,e)),ps:s,pe:e}); }); d.setDate(d.getDate()+1); }
    }
  });
  return out;
}
function isLive(f){ return f.active&&blockerHits(NOW,new Date(+NOW+60000),null,f).length>0; }
function nextOcc(f,skipLive){
  if(f.type==="Once") return [T(f.s),T(f.e)];
  const live=skipLive?null:blockerHits(NOW,new Date(+NOW+60000),null,f)[0]; if(live) return [live.ps,live.pe];
  for(let i=0;i<8;i++){ const d=new Date(NOW); d.setHours(0,0,0,0); d.setDate(d.getDate()+i); const wd=d.getDay(); if(wd===0||wd===6) continue;
    for(const p of PEAKS){ const s=new Date(d); s.setHours(p[0]); if(s>NOW){ const e=new Date(d); e.setHours(p[1]); return [s,e]; } } }
  return null;
}
function blockerStatus(f){ if(!f.active) return ["idle","Inactive"]; if(isLive(f)) return ["stop","Active · in effect now"]; const o=nextOcc(f); if(!o||o[1]<NOW) return ["idle","Active · past"]; return ["info","Active · starts "+rel(o[0])]; }
const scopeTxt=f=>f.scope==="Global"?"Global":f.svcs.join(", ");
function winRel(c){ if(TERMINAL.indexOf(c.state)>=0) return ""; if(NOW<c.ws) return "starts "+rel(c.ws); if(NOW<=c.we) return "in window · ends "+rel(c.we); return "ended "+dur(NOW-c.we)+" ago"; }
const flagTxt=h=>h.f.name+" ("+fhm(h.s)+"–"+fhm(h.e)+")";

const NODE={reviewed:5,inclinked:5,edited:0,rescheduled:2,created:0,draft:0,cancelled:0,submitted:1,assessed:2,backfill:2,pending:3,auto:3,approved:3,rejected:3,notify:3,expired:4,verifying:4,verified:4,blocked:4,executed:5,rollback:5,marked:5,sre:5,signal:5,closed:6,amended:6,reraised:3};
const LBL={reviewed:"Post-review done",inclinked:"Incident linked",edited:"Draft edited",rescheduled:"Rescheduled",created:"Created",draft:"Draft · collecting",cancelled:"Cancelled",submitted:"Submitted",assessed:"Assessed",backfill:"Async backfill",pending:"Pending For Approval",notify:"Escalation event",auto:"Auto-approved",approved:"Approved",rejected:"Rejected",expired:"Expired",verifying:"Verifying",verified:"Verified",blocked:"Blocked",executed:"Executed",rollback:"Rollback deploy",marked:"Outcome marked",sre:"Pending SRE review",signal:"Pending verification",closed:"Close",amended:"Outcome amended",reraised:"Re-raised as new draft"};
function spine(c){
  const cfg=c.type==="Configuration";
  const names=cfg?["Created","Submitted","Assessed","Approval","Executing","Close"]:["Created","Submitted","Assessed","Approval","Gate","Executed","Close"];
  const map=k=>{ let n=NODE[k]; if(n==null) return null; if(cfg&&n>=4) n=(n===6?5:4); return n; };
  const last={}; let maxN=-1;
  c.trail.forEach(e=>{ const n=map(e[0]); if(n==null) return; last[n]=e; if(n>maxN) maxN=n; });
  const tone=stateTone(c), nowCls=tone==="wait"?"waiting":tone==="stop"?"":tone==="go"?"":tone;
  return '<ol class="spine">'+names.map((nm,i)=>{
    const e=last[i]; let cls="todo", st="";
    if(i<maxN) cls=e?"done":"skip";
    else if(i===maxN) cls=(c.state==="Close"&&c.outcome==="SUCCESS")||(tone==="go")?"done end":"now "+nowCls;
    if(e) st=(LBL[e[0]]===nm?'':'<span class="lbl">'+LBL[e[0]]+'</span>')+'<time>'+fd(T(e[1]))+'</time>';
    else if(i>maxN){ let h="—"; if((nm==="Gate"||nm==="Executing")) h="window "+fd(c.ws); st='<span class="lbl" style="color:var(--ink-3)">not yet</span><span class="st">'+h+'</span>'; }
    else st='<span class="lbl">not reached</span><span class="st">'+(c.state==="Blocked"?"blocked before approval":"skipped")+'</span>';
    if(i===maxN&&c.state==="Pending For Approval") st+='<span class="st">waiting '+dur(NOW-T(ev(c,"pending")[1]))+'</span>';
    return '<li class="'+cls+'"><span class="dot"></span><b>'+nm+'</b>'+st+'</li>';
  }).join("")+'</ol>';
}
function missingInputs(c){ const m=[]; if(c.tested==null) m.push("Tested on lower stage"); if(c.rollback==null) m.push("Support rollback"); if(c.db==null) m.push("DB changes"); if(c.type!=="Configuration"&&!c.commits.length) m.push("GitLab changelogs"); return m; }
function leadTime(c){ if(c.type==="Emergency") return {ok:true,t:"Exempt (Emergency)"}; const need=c.env==="Prod"?3:1; const have=(c.ws-T(c.created))/86400000; return {ok:have>=need,t:(have>=1?have.toFixed(1)+" d":dur(c.ws-T(c.created)))+" ahead · needs "+need+" d ("+c.env+")"}; }

const ASS_RULE_NAMES={R1:"Hard Blocker overlap",R2:"Downtime on a T1 service",R3:"Downtime exceeds 60 min",R4:"DB change without rollback",R5:"Production change without rollback",R6:"Bronze service in production",R7:"Error budget below 20%"};
function assessmentEvidence(c,r){
  const value=v=>v==null?"Not provided":v?"Yes":"No";
  if(r.id==="R2") return SVC[c.svc].tier+" · downtime "+value(c.downtime);
  if(r.id==="R3"){ const t=thOf(c).R3; return c.downtime==null?"Downtime not provided · threshold "+t+" min":!c.downtime?"No downtime":c.downMin==null?"Downtime duration not provided · threshold "+t+" min":c.downMin+" min "+(c.downMin>t?">":"≤")+" "+t+" min threshold"; }
  if(r.id==="R4") return "DB "+value(c.db)+" · rollback "+value(c.rollback);
  if(r.id==="R5") return c.env+" · rollback "+value(c.rollback);
  if(r.id==="R6") return "Maturity "+c.mat+" · "+c.env;
  if(r.id==="R7"){ const t=thOf(c).R7; return c.eb==null?"Error budget not provided · threshold "+t+"%":c.eb+"% remaining "+(c.eb<t?"<":"≥")+" "+t+"% threshold"; }
  return r.ev;
}
function assessmentMissingFor(c,r){
  if(r.id==="R2"&&c.downtime==null) return ["Downtime needed"];
  if(r.id==="R4") return [["DB changes",c.db],["Support rollback",c.rollback]].filter(x=>x[1]==null).map(x=>x[0]);
  if(r.id==="R5"&&c.rollback==null) return ["Support rollback"];
  return [];
}
function assessmentBasis(r,clear,c){

    (clear?'<b class="mono">'+r.id+'</b> '+esc(ruleName(r,c))+' <span class="ass-clear-evidence">'+esc(assessmentEvidence(c,r))+'</span>':'Data source')+'</summary>'+
    '<dl><dt>Inputs</dt><dd>'+esc(r.input)+'</dd><dt>Source</dt><dd>'+esc(r.src)+'</dd></dl></details>';
}
function assessmentBlocker(c){
  if(!c.flag) return '';
  const overlaps=blockerHits(c.ws,c.we,c.svc), emer=c.type==="Emergency";
  return '<div class="ass-blocker" id="assessmentBlocker">'+(emer?'':'<p>Approval cannot clear a hard Blocker; the change window must avoid it.</p>')+
    (overlaps.length?overlaps.map(h=>'<div class="ass-overlap"><b>'+esc(h.f.name)+'</b><span class="mono">'+fd(h.s)+' → '+fd(h.e)+' · UTC+08</span></div>').join(''):'<p>'+esc(c.flag)+'</p>')+

function assessmentRiskCard(c,rl){
  const hits=rl.filter(r=>r.st==="hit"), missingRules=rl.filter(r=>r.st==="missing"), clear=rl.filter(r=>r.st==="clear"), issues=rl.filter(r=>r.st!=="clear");
  const missing=Array.from(new Set(missingInputs(c).concat(missingRules.flatMap(r=>assessmentMissingFor(c,r)),c.downtime&&c.downMin==null?["Downtime duration"]:[]))), emer=c.type==="Emergency", reviewed=has(c,"reviewed"), at=ev(c,"assessed")||ev(c,"backfill");
  const issueHtml=issues.map(r=>{
    const facts=r.id==="R1"?assessmentBlocker(c):'<div class="ass-facts"><div><span class="label">Evidence</span>'+esc(assessmentEvidence(c,r))+'</div>'+(r.st==="hit"?'<div><span class="label">Mitigation</span>'+esc(r.fix)+'</div>':'')+'</div>';
    return '<article class="ass-issue '+r.st+'" data-rule="'+r.id+'" data-status="'+r.st+'"><div class="ass-rule-head">'+pill(r.st==="missing"?'wait':'stop',r.st==="missing"?'MISSING':'HIT')+'<b><span class="mono">'+r.id+'</span> · '+esc(ruleName(r,c))+'</b></div>'+facts+assessmentBasis(r,false,c)+'</article>';
  }).join('');
  return '<section class="card card-pad" id="assessmentRisk" aria-label="Risk assessment" style="margin-bottom:18px"><div class="sect-head"><h2>Risk assessment</h2></div>'+
    '<div class="ass-summary"><span>Risk '+pill(riskTone(risk(c)),risk(c))+blockedPill(c)+'</span><span title="Input completeness, not risk level">Confidence <b>'+conf(c)+'</b></span><span class="ass-time">Assessed '+fd(T(at[1]))+'</span></div>'+
    (issues.length?'<p class="ass-counts">'+hits.length+' triggered · '+missingRules.length+' with missing input</p>':'')+

    (issueHtml?'<div class="ass-issues">'+issueHtml+'</div>':'')+
    (clear.length?'<details class="ass-cleared" id="assCleared"><summary>'+clear.length+' checks not triggered</summary><div class="ass-cleared-list">'+clear.map(r=>assessmentBasis(r,true,c)).join('')+'</div></details>':'')+'</section>';

function gateEval(c){
  const emer=c.type==="Emergency";
  const g=c.gate, at=g?T(g.at):NOW;
  const appr=ev(c,"auto")||ev(c,"approved"), approved=appr&&T(appr[1])<=at&&c.state!=="Rejected";
  const inWin=at>=c.ws&&at<=c.we;
  const checks=[
    ["Change submitted",["Created","Cancelled"].indexOf(c.state)<0,["Created","Cancelled"].indexOf(c.state)<0?"Submitted "+fd(T((ev(c,"submitted")||c.trail[0])[1])):"Still a draft"],
    ["Change approved",!!approved,approved?(appr[0]==="auto"?"Auto-approved ":"Approved by "+appr[2]+" ")+fd(T(appr[1])):(c.state==="Rejected"?"Rejected":c.state==="Blocked"?"Never approved — blocked at assessment":"Awaiting approval")],
    ["Version matches pipeline TAG",emer||!g?null:g.tag===c.ver,g?"Pipeline TAG "+g.tag+" vs change "+c.ver:"Will compare the pipeline TAG with "+c.ver],
    ["Inside change window",emer?null:inWin,(g?"Called ":"Now ")+fd(at)+" · window "+fd(c.ws)+" → "+fhm(c.we)],
    ["Error budget sufficient",emer?null:c.eb>=thOf(c).R7,c.eb+"% remaining · minimum "+thOf(c).R7+"%"],
    ["No Blocker window overlap",emer?null:!c.flag,c.flag?c.flag:"No overlap"]
  ];
  const fails=checks.filter(x=>x[1]===false).length;
  return {checks:checks,fails:fails,can:fails===0,at:at,recorded:!!g};
}

  let p="";

      const node=n=>'<div class="inode"><b>'+n.svc+'</b>'+matb(SVC[n.svc].mat)+'<span class="h">'+(n.hop?n.hop+" hop":"")+'</span></div>';

        '<div><div class="arrow">→</div><div class="icenter">'+c.svc+'<small>'+c.prev+' → '+c.ver+'</small></div><div class="arrow">→</div></div>'+
        '<div class="icol"><h4>Dependencies (downstream)</h4>'+(B.down.map(node).join("")||'<div class="csub">No dependencies</div>')+'</div></div>'+
        '<div style="margin-top:14px"><div class="minihead">Affected use cases</div>'+B.usecases.map(u=>'<span class="uc">'+u+'</span>').join("")+'</div></div>';
    }
  }
  if(cur.tab==="appr"){
    const aEv=c.trail.filter(e=>["assessed","pending","notify","auto","approved","rejected"].indexOf(e[0])>=0).reverse();
    const pending=c.state==="Pending For Approval", decision=ev(c,"rejected")||ev(c,"approved")||ev(c,"auto");
    const badge=pending?pill("wait","Pending approval",1):decision?pill(decision[0]==="rejected"?"stop":"go",decision[0]==="auto"?"Auto-approved":decision[0]==="rejected"?"Rejected":"Approved",1):pill("idle","Not requested",1);
    p='<div class="card card-pad" style="margin-bottom:18px"><div class="sect-head"><h2>Decision</h2>'+badge+'</div><div class="approval-assignees"><b>Authorised approvers:</b> '+esc(appr.join(", ")||"None assigned")+'</div>'+
      (c.type==="Emergency"&&decision&&decision[0]==="auto"&&!has(c,"reviewed")?'<p class="csub" style="margin:8px 0 0">SRE post-review required.</p>':'')+
      (pending&&canApprove(c)?'<textarea class="cm" placeholder="Comment (required for reject)"></textarea><div style="display:flex;gap:9px"><button class="btn primary" data-act="approve" data-id="'+c.id+'">Approve</button><button class="btn danger" data-act="reject" data-id="'+c.id+'">Reject</button></div>':'')+'</div>'+
      (aEv.length?'<div class="card card-pad"><div class="sect-head"><h2>Approval trail</h2></div><ul class="vt">'+aEv.map(e=>'<li class="'+(e[0]==="rejected"?"bad":e[0]==="pending"||e[0]==="notify"?"hold":"ok")+'"><span class="vd"></span><div><div class="vb">'+LBL[e[0]]+'</div><div class="vm">'+fd(T(e[1]))+' · '+e[2]+'</div>'+(e[3]?'<div class="vx">'+esc(e[3])+'</div>':'')+'</div></li>').join("")+'</ul></div>':'');
  }
  if(cur.tab==="gate"){
      const js={change:c.id,state:G.recorded?(G.can?"Approved":c.state==="Blocked"?"Blocked":"Approved"):c.state,risk:R||"—",risk_confidence:cf||"—",blocker_conflict:!!c.flag,can_execute:G.can,assessed_at:assessed(c)?iso(T((ev(c,"assessed")||ev(c,"backfill"))[1])):null};
      const jtxt=JSON.stringify(js,null,2).replace(/"(\w+)":/g,'<span class="k">"$1"</span>:').replace(/: false/g,': <span class="f">false</span>').replace(/: true/g,': <span class="t">true</span>');
      p='<div class="cols2">'+'<div class="card card-pad"><div class="sect-head"><h2>'+(G.recorded?"Gate result":"Gate preview")+'</h2><span class="hint">'+(G.recorded?"Recorded":"Evaluated now")+'</span></div>'+
        '<div class="fdec '+(G.can?"go":"stop")+'"><div class="k">Decision</div><div>'+(G.can?pill("go","can_execute = true",1):pill("stop","can_execute = false · "+G.fails+" failed",1))+'</div></div><div class="minihead" style="margin-top:14px">Check items</div><div class="checks">'+
        G.checks.map(x=>'<div class="check">'+(x[1]===null?pill("idle",c.type==="Emergency"?"skip":"at call"):x[1]?pill("go","Pass"):pill("stop","Fail"))+'<span class="nm">'+x[0]+'</span><span class="ds">'+esc(x[2])+'</span></div>').join("")+'</div>'+
        (c.rbgate?'<div class="check" style="border-top:1px solid var(--rule);margin-top:8px">'+pill("info","Rollback")+'<span class="nm">In-window rollback · '+c.rbgate.pipe+'</span><span class="ds">'+fd(T(c.rbgate.at))+' · TAG '+c.rbgate.tag+' = previous version → released without re-assessment</span></div>':'')+
        '</div>'+
        '<div><details class="card card-pad"><summary style="cursor:pointer;font-weight:650">Request &amp; response</summary><dl class="dl" style="margin-top:12px"><dt>Pipeline run ID</dt><dd class="mono">'+(c.gate?c.gate.pipe:"—")+'</dd><dt>TAG</dt><dd class="mono">'+(c.gate?c.gate.tag:"—")+'</dd><dt>Called at</dt><dd class="mono">'+(c.gate?fd(T(c.gate.at)):"Not called")+'</dd></dl><div class="minihead">GET /changes/{id}/gate</div><pre class="json">'+jtxt+'</pre>'+
        '<p class="csub" style="font-size:12px;margin:0">Failed checks or unavailable CMP block deployment.</p></details></div></div>'+execCard(c);
  }
  if(cur.tab==="close"){
    const k=c.closure;
    if(!k) p='<div class="empty"><b>Closure starts after execution</b></div>';
    else{
      const el=(n,x)=>'<div class="el '+x[0]+'"><div class="n">'+n+'</div><div class="s">'+(x[0]==="ok"?"✓ Passed":x[0]==="bad"?"✕ Conflict":"… Pending")+'</div><div class="d">'+esc(x[1])+'</div></div>';
      p='<div class="card card-pad">'+'<div class="sect-head"><h2>Closure</h2></div>'+
        '<dl class="dl" style="max-width:640px"><dt>Outcome marked</dt><dd>'+(k.mark?'<b>'+k.mark+'</b> by '+k.markBy+' · '+fd(T(k.markAt))+' · '+k.via:'<span style="color:var(--wait)">not marked</span>')+'</dd><dt>Status</dt><dd>'+(c.state==="Close"?pill("go","Closed"):k.sub==="Pending SRE review"?pill("stop","Pending SRE review"):k.sub==="Pending verification"?pill("wait","Pending verification"):pill("wait",k.sub||"Open"))+'</dd>'+(c.outcome?'<dt>Result</dt><dd>'+pill(c.outcome==="SUCCESS"?"go":c.outcome==="UNCONFIRMED"?"idle":"stop",c.outcome)+'</dd>':'')+''+(k.closedAt?'<dt>Closed by / at</dt><dd>'+((ev(c,"closed")||[])[2]||"CMP")+' · '+fd(T(k.closedAt))+'</dd><dt>Trigger</dt><dd>'+k.trigger+'</dd>':'')+'</dl>'+
        (k.mark==="SUCCESS"||!k.mark?'<div class="three">'+el(cfg?"① Execution declared":"① Executed (pipeline success)",k.executed)+el("② Post-deploy metrics normal",k.metrics)+el("③ Running version = target",k.version)+'</div>':'<div class="three">'+el("① Executed",k.executed)+el("② Metrics",k.metrics)+el("③ Version",k.version)+'</div><p style="font-size:12.5px;color:var(--ink-2)">FAILED / ROLLBACK close without verification.</p>')+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        (ROLE==="DevOps"&&c.state==="Executed"&&!k.mark?'<button class="btn primary" data-act="marksuccess" data-id="'+c.id+'">Mark success</button><button class="btn" data-act="markfail" data-id="'+c.id+'">Mark failed</button><button class="btn" data-act="markrb" data-id="'+c.id+'">Mark rollback</button>':'')+
        (k.sub==="Pending verification"?'<p style="margin:0;font-size:12.5px;color:var(--ink-2)">Verified automatically when metrics are ready; on timeout → SRE review.</p>':'')+
        (k.sub==="Pending SRE review"&&can("review")?'<button class="btn danger" data-act="srefail" data-id="'+c.id+'">Confirm failed</button>':'')+
        (c.outcome==="UNCONFIRMED"&&!c.amended&&can("review")?'<button class="btn" data-act="amend" data-id="'+c.id+'">Amend outcome</button>':'')+'</div></div>';
    }
  }
  if(cur.tab==="close"&&(c.closure||incOf(c.id).length)) p+=postReviewCard(c)+incCard(c);
  if(cur.tab==="audit"){
    p='<div class="card card-pad"><div class="sect-head"><h2>Audit trail</h2></div><ul class="vt">'+c.trail.slice().reverse().map(e=>'<li class="'+(["rejected","blocked","sre"].indexOf(e[0])>=0?"bad":["pending","notify","signal","draft"].indexOf(e[0])>=0?"hold":"ok")+'"><span class="vd"></span><div><div class="vb">'+LBL[e[0]]+'</div><div class="vm">'+fd(T(e[1]))+' · '+e[2]+' · <span class="srcb">'+srcOf(e,c)+'</span></div>'+(e[3]?'<div class="vx">'+esc(e[3])+'</div>':'')+'</div></li>').join("")+'</ul></div>';
  }
  $("#detailRoot").innerHTML=h+'<div class="tpanel is-active">'+p+'</div>';
}

const incOf=id=>INC.filter(x=>x[5]===id);
function incCard(c){
  const xs=incOf(c.id);
  return '<div class="card card-pad" style="margin-top:18px"><div class="sect-head"><h2>Linked incidents</h2></div>'+
    (xs.length?'<table class="rl"><thead><tr><th>Incident</th><th>Sev</th><th>Started</th><th>Title</th><th>Linked by</th></tr></thead><tbody>'+xs.map(x=>'<tr><td class="mono">'+x[0]+'</td><td>'+pill(x[1]==="P1"||x[1]==="P2"?"stop":"wait",x[1])+'</td><td class="mono">'+fd(T(x[3]))+' <span class="csub" style="display:inline">'+(c.we?"+"+dur(T(x[3])-c.ws)+" after window start":"")+'</span></td><td>'+esc(x[4])+'</td><td class="sm">'+x[6]+'</td></tr>').join("")+'</tbody></table>':'<p class="csub" style="font-size:12.5px;margin:0">No linked incidents.</p>')+
    (can("review")?'<div style="margin-top:12px"><button class="btn sm" data-act="linkinc" data-id="'+c.id+'">Link incident</button></div>':'')+'</div>';
}
function postReviewCard(c){
  if(c.type!=="Emergency") return "";
  const done=has(c,"reviewed"), e=ev(c,"reviewed");
  return '<div class="card card-pad" style="margin-top:18px"><div class="sect-head"><h2>Emergency post-review</h2></div>'+
    (done?pill("go","Done",1)+'<p style="margin:8px 0 0;font-size:13px;color:var(--ink-2)">'+esc(e[3])+' — '+e[2]+', '+fd(T(e[1]))+'</p>'
      :postReviewDue(c)?pill("wait","Due",1)+(can("review")?'<div style="margin-top:10px"><button class="btn sm primary" data-act="postreview" data-id="'+c.id+'">Complete post-review</button></div>':'')
      :'<p class="csub" style="margin:0">Available after the outcome is marked.</p>')+'</div>';
}
function srcOf(e,c){ if(e[2]==="CMP") return "platform"; if(e[2]==="GitLab") return "gitlab"; if(/Mattermost/i.test(e[3]||"")) return "mattermost"; if(e[0]==="created") return c.src; return /GitLab/.test(e[3]||"")?"gitlab":"platform-ui"; }
function execCard(c){
  const g=c.gate, ex=ev(c,"executed");
  if(!g&&!ex) return "";
  const gs=g?T(g.at):null, xe=ex?T(ex[1]):null, evidence=[];
  if(g) evidence.push('GitLab · release pipeline '+g.pipe);
  if(c.rbgate) evidence.push('GitLab · rollback pipeline '+c.rbgate.pipe);
  if(xe) evidence.push('Datadog · '+c.svc+' · '+fhm(new Date(xe-18e5))+'–'+fhm(new Date(+xe+36e5)));
  return '<div class="card card-pad" style="margin-top:18px"><div class="sect-head"><h2>Execution evidence</h2></div>'+
    '<dl class="dl" style="max-width:640px">'+(xe?'<dt>Executed</dt><dd class="mono">'+fd(xe)+'</dd>':'')+
    (gs&&xe?'<dt>Deploy duration</dt><dd class="mono">'+dur(xe-gs)+'</dd>':'')+'</dl>'+
    '<div class="xlinks">'+evidence.map(x=>'<span class="csub">'+esc(x)+'</span>').join("")+'</div></div>';
}

const DASH={day:17,queuePage:1,queueRole:"SRE"};
const CAL={svcs:[],state:"all",env:"",q:"",svcQ:"",svcOpen:false,view:"week",period:"week",start:new Date(2026,8,14),month:8,year:2026,focus:"2026-09-17",slot:"",listDay:"",listSlot:"",listPage:1,pageSize:20,windowPage:1,windowsOpen:false,from:"",to:""};
const BF={q:"",type:"",scope:"",status:"",page:1,pageSize:20};
const dayKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function calAttention(c){ return TERMINAL.indexOf(c.state)<0&&(c.state==="Blocked"||c.state==="Pending For Approval"||(c.closure&&c.closure.sub==="Pending SRE review")); }
function calChanges(){
  const from=CAL.from?new Date(CAL.from):null,to=CAL.to?new Date(CAL.to):null,services=new Set(CAL.svcs),query=CAL.q.trim();
  return C.filter(c=>(!services.size||services.has(c.svc))&&(!CAL.env||c.env===CAL.env)&&
    (CAL.state==="all"||(CAL.state==="open"?TERMINAL.indexOf(c.state)<0:CAL.state==="attention"?calAttention(c):c.state===CAL.state))&&(!from||c.ws>=from)&&(!to||c.ws<=to)&&(!query||matchC(c,query).ok))
    .sort((a,b)=>a.ws-b.ws||a.id.localeCompare(b.id));
}
function calWindowScope(f){ return !CAL.svcs.length||CAL.svcs.some(s=>inScope(f,s)); }
function calBlockers(d){ const s=new Date(d),e=new Date(d); s.setHours(0,0,0,0); e.setHours(24,0,0,0); return FLAGS.filter(f=>f.active&&calWindowScope(f)&&(f.type==="Once"?T(f.s)<e&&T(f.e)>s:d.getDay()>0&&d.getDay()<6)); }

function calResetPages(){ CAL.listPage=1; CAL.windowPage=1; }

function calListView(rows,monthly){

// Deterministic daily series for the last 90 days. The last 30 days distribute exactly the REL totals.
const SERIES=(function(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const days=[]; for(let i=89;i>=0;i--){ const d=new Date(2026,8,17-i); days.push({d:d,S:0,F:0,T:0,R:0,U:0}); }
  let S=0,Fa=0,To=0,Rb=0,Un=0; REL.forEach(r=>{ S+=r[1];Fa+=r[2];To+=r[3];Rb+=r[4];Un+=r[5]; });
  const bag=[]; [["S",S],["F",Fa],["T",To],["R",Rb],["U",Un]].forEach(x=>{ for(let i=0;i<x[1];i++) bag.push(x[0]); });
  bag.forEach(k=>{ let i; do{ i=60+Math.floor(rnd()*30); }while(days[i].d.getDay()===0&&rnd()<.8); days[i][k]++; });
  for(let i=0;i<60;i++){ if(days[i].d.getDay()===0||days[i].d.getDay()===6) continue; const n=Math.floor(rnd()*4); for(let j=0;j<n;j++){ const x=rnd(); days[i][x<.86?"S":x<.91?"F":x<.95?"R":x<.97?"T":"U"]++; } }
  return days;
})();
function bucket(range,gran){

    if(gran==="day"){ key=+d.d; lab=d.d.getDate()+" "+MON[d.d.getMonth()]; }
    else if(gran==="week"){ const m=new Date(d.d); m.setDate(m.getDate()-((m.getDay()+6)%7)); key=+m; lab="wk "+m.getDate()+" "+MON[m.getMonth()]; }
    else { key=d.d.getMonth(); lab=MON[d.d.getMonth()]; }
    let b=out.find(o=>o.key===key); if(!b){ b={key:key,lab:lab,S:0,F:0,T:0,R:0,U:0}; out.push(b); }
    ["S","F","T","R","U"].forEach(k=>b[k]+=d[k]); });
  return out;
}
function trendSVG(bs){
  const W=Math.max(320,bs.length*22), H=150, pb=22, max=Math.max(1,...bs.map(b=>b.S+b.F+b.T+b.R+b.U)), bw=W/bs.length;

    [["S","var(--go)"],["F","var(--stop)"],["T","var(--wait)"],["R","#C2410C"],["U","var(--idle-edge)"]].forEach(k=>{ const h=(b[k[0]]/max)*(H-pb-14); if(h>0){ y-=h; g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+k[1]+'" rx="1.5"><title>'+b.lab+' · '+k[0]+' '+b[k[0]]+'</title></rect>'; } });
    const step=Math.ceil(bs.length/12); if(i%step===0) g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="var(--ink-3)" font-family="ui-monospace,monospace">'+b.lab+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" style="display:block;min-width:'+Math.min(W,640)+'px">'+g+'<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--rule-2)"/></svg>';

/* ════════ CMD-K ════════ */
let K={items:[],sel:0};
function cmdkSearch(q){
  q=q.trim(); const ql=q.toLowerCase(), res=[]; K.groups={};
  if(!q){ RECENT.slice(0,5).forEach(id=>{ const c=byId[id]; if(c) res.push({g:"Recently viewed",a:'<span class="mono">'+c.id+'</span> '+pill(stateTone(c),stateText(c)),b:c.svc+' '+c.ver+' · '+esc(c.title),go:()=>openChange(c.id)}); }); }
  else{
    const exact=C.find(c=>c.id.toLowerCase()===ql||(/^\d+$/.test(ql)&&c.id.slice(-6)===ql.padStart(6,"0")));
    const matches=C.map(c=>({c:c,m:matchC(c,q)})).filter(x=>x.m.ok||x.c===exact).sort((x,y)=>(x.c===exact?-1:0)-(y.c===exact?-1:0));
    K.groups.Changes={shown:Math.min(8,matches.length),total:matches.length};
    matches.slice(0,8).forEach(x=>{ const c=x.c;
      res.push({g:"Changes",a:'<span class="mono">'+hl(c.id,q)+'</span> '+pill(stateTone(c),stateText(c)),b:hl(c.svc,q)+' '+hl(c.ver,q)+' · '+hl(c.title,q)+' · '+fd(c.ws),go:()=>openChange(c.id)}); });
    const services=Object.keys(SVC).filter(s=>s.toLowerCase().indexOf(ql)>=0);
    K.groups["All changes of a service"]={shown:Math.min(4,services.length),total:services.length};
    services.slice(0,4).forEach(s=>{ const r=recon(s);
      res.push({g:"All changes of a service",a:'<b>'+hl(s,q)+'</b> '+matb(SVC[s].mat)+pill(r.tone,r.t),b:SVC[s].team+' · running '+SVC[s].run+' · expected '+SVC[s].exp,go:()=>{ showServiceChanges(s); }}); });
    if(matches.length||services.length) res.push({g:"Full results",a:'View all matching changes'+(matches.length?' · '+matches.length:''),b:'Open Changes with this search',go:()=>showSearchResults(q)});
  }
  K.items=res; K.sel=0; drawCmdk();
}
function drawCmdk(){
  let html="", lastG=""; K.items.forEach((it,i)=>{ if(it.g!==lastG){ const count=K.groups&&K.groups[it.g]; html+='<div class="cmdk-g">'+it.g+(count?' <span class="cmdk-count">'+count.shown+' / '+count.total+'</span>':'')+'</div>'; lastG=it.g; } html+='<div class="cmdk-i" data-k="'+i+'" aria-selected="'+(i===K.sel)+'"><div><div class="a">'+it.a+'</div><div class="b">'+it.b+'</div></div></div>'; });
  $("#cmdkRes").innerHTML=html||'<div class="cmdk-empty">Nothing matches. Search by change no., title, service or version.</div>';
}

function openCmdk(q){ $("#cmdk").hidden=false; const i=$("#cmdkIn"); i.value=q||""; cmdkSearch(i.value); setTimeout(()=>i.focus(),10); }
function closeCmdk(){ $("#cmdk").hidden=true; }
function pickCmdk(i){ const it=K.items[i]; if(!it) return; closeCmdk(); it.go(); }

/* ════════ LIFECYCLE (prototype: mutate in memory) ════════ */
function stamp(){ return pad(NOW.getMonth()+1)+"-"+pad(NOW.getDate())+" "+fhm(NOW); }
function nextId(){ let n=Math.max(...C.map(c=>+c.id.slice(-6)))+1; return "CMP-2026-"+String(n).padStart(6,"0"); }
function assessRoute(c){
  const now=stamp(); c.th={ver:RS.ver,R3:RS.R3,R7:RS.R7};
  const hits=c.type==="Emergency"?[]:blockerHits(c.ws,c.we,c.svc);
  c.flag=hits.length?flagTxt(hits[0]):null; c._idx=null;
  if(c.type==="Emergency"){ c.state="Approved"; c.trail.push(["auto",now,"CMP","Emergency → auto-approved · SRE notified · post-review required"]);
    c.acts=[]; c.why="Emergency · auto-approved · run the release pipeline";
    c.verdict={tone:"info",t:"Approved via emergency lane — deploy now",b:"SRE post-review is required after the outcome is marked."}; return; }
  c.trail.push(["assessed",now,"CMP",""]);
  const R=risk(c), hl=redlines(c).filter(r=>r.st!=="clear").map(r=>r.id);
  c.trail[c.trail.length-1][3]="Risk "+R+(hl.length?" ("+hl.join(", ")+")":"")+" · confidence "+conf(c)+(c.flag?" · Blocked":"");
  if(c.flag){ c.state="Blocked"; c.trail.push(["blocked",now,"CMP","Hard Blocker → Blocked (clear by moving the window)"]);
    c.acts=[{role:"DevOps",tone:"stop",text:"Reschedule — window overlaps "+c.flag,btns:[["Reschedule","reschedule"]]}]; c.why="Window inside "+hits[0].f.name;
    c.verdict={tone:"stop",t:"Blocked — change window overlaps a Blocker window",b:fd(hits[0].s)+" → "+fhm(hits[0].e)+" overlaps “"+hits[0].f.name+"”. Reschedule the change window."}; }
  else if(R==="HIGH"){ c.state="Pending For Approval"; c.trail.push(["pending",now,"CMP","Approval requested from "+SVC[c.svc].team+" approvers"]);
    c.acts=[{role:"SRE",tone:"stop",text:"Approve or reject — red line "+hl.join(", "),btns:[["Approve","approve"],["Reject","reject"]]}]; c.why=hl.join(", ")+" — waiting for SRE";
    c.verdict={tone:"wait",t:"Cannot deploy yet — waiting for SRE approval",b:"Triggered rules: "+hl.join(", ")+"."}; }
  else { c.state="Approved"; c.trail.push(["auto",now,"CMP","LOW → auto-approved"]); c.acts=[]; c.why="Approved · window "+fd(c.ws);
    c.verdict={tone:"info",t:"Approved — "+(c.type==="Configuration"?"execute in the window, no gate":"gate opens with the window"),b:"Window "+fd(c.ws)+" → "+fhm(c.we)+"."}; }
}
